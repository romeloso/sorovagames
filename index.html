<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sorova Games — aprende a leer, teclear y jugar sopa de letras. Aprender es una aventura."
    />
    <meta name="theme-color" content="#0f172a" />
    <script>
      ;(function () {
        try {
          var theme = 'dark'
          var raw = localStorage.getItem('mis-juegos.v1')
          if (raw) {
            var parsed = JSON.parse(raw)
            if (parsed && parsed.theme === 'light') theme = 'light'
          }
          if (theme === 'dark') document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
    <meta name="application-name" content="Sorova Games" />

      property="og:description"
